[package]
name = "cx"
version = "0.1.0"
edition = "2021"
description = "A local Codex session manager for searching, previewing, and resuming Codex sessions."
readme = "README.md"
license = "MIT"
repository = "https://github.com/Tobiadefami/codex-explorer"
homepage = "https://github.com/Tobiadefami/codex-explorer"
keywords = ["codex", "cli", "tui", "sessions"]
categories = ["command-line-utilities"]
include = [
    "Cargo.lock",
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "src/**",
    "tests/**",
]

[[bin]]
name = "cx"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29.0"
dirs = "6"
ratatui = "0.30.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
